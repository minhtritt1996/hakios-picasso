# devices/picasso/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device picasso
	title       Redmi K30 5G
	vendor      Xiaomi
	soc         sm7250
	defconfig   picasso_defconfig
	firmware    pull-firmware.sh
	maintainer  ios-sweet/hakios
	status      display     partial   UEFI's framebuffer; the kernel attaches MiniIOMobileFramebuffer (display 1125x2436 on a panel of 1080x2400, 4320 B a row); the window server has not drawn yet
	status      touch       missing   the panel's touch controller is not mapped yet
	status      buttons     missing
	status      cpu         partial   the kernel boots and runs on core 0; a kernel started on a secondary core (bootcpu=1) gets its stack and heartbeat but logs nothing yet
	status      gpu         missing   Adreno 620: the phone's a620_zap/a630_sqe/a650_gmu are in fw-gpu/, no drawing verified
	status      storage     partial   the loader surveys UFS (109 partitions, 6 units) and serves the block service; the kernel's root is the RAM disk (system.apfs 2.3 GB resident), not UFS
	status      usb         works     the loader's fastboot: product xnuloader, oem ramdisk + stage uploads system.apfs (2.3 GB in ~80 s), oem run, oem log after a panic
	status      network     partial   dlil and lo0 come up in the kernel
	status      audio       missing
	status      battery     missing
	status      camera      missing
	status      wifi        missing   WLAN is inside the modem (modem_wlan_region 0x8c000000+0xF800000)
	status      cellular    partial   the shim lineage has booted mss through PAS (mpss=0x4); not done from HakiOS
	status      thermal     missing
