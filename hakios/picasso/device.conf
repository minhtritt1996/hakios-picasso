# hakios/picasso/device.conf -- mo ta thiet bi theo dinh dang cua
# tools/hakios-device.py (xem devices/redwood/device.conf trong hakios-sm7325).
# Trang thai: works / partial / missing theo tung khoi, kem bang chung hoac ghi chu.

device picasso
	title       Redmi K30 5G
	vendor      Xiaomi
	soc         sm7250
	defconfig   picasso_defconfig
	firmware    pull-firmware.sh
	maintainer  ios-sweet/hakios branch
	status      uefi        available  Mu-Silicium qua YinCQL/uefi_picasso, da boot that tren may nay (UniXNU-picasso)
	status      loader      missing    chua thu; xnuloader cua HakiOS can DT/layout picasso
	status      storage     partial    UFS host 0x1d84000 doc duoc bang shim cua ta (sweet_ufs.c); chua port sang HakiOS
	status      display     partial    cont_splash_region 0xa0000000 (35 MiB) qua SweetFramebuffer cua ta
	status      touch       missing    panel/PMIC cua picasso chua map; DT co node touchscreen
	status      gpu         missing    Adreno 620 (firmware a620_zap.mbn); chua co driver
	status      wifi        missing    WLAN nam trong modem (modem_wlan_region 0x8c000000+0xF800000)
	status      cellular    partial    PAS mpss=0x4 da boot duoc duoi shim cua ta (sweet_modem/sweet_pil)
	status      audio       missing
	status      battery     missing
	status      camera      missing
