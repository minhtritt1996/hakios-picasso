# devices/picasso/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device picasso
	title       Redmi K30 5G
	vendor      Xiaomi
	soc         sm7250
	defconfig   picasso_defconfig
	firmware    pull-firmware.sh
	maintainer  minhtritt1996 (README.md)
	status      display     partial   UEFI framebuffer; kernel attaches MiniIOMobileFramebuffer (1125x2436 on 1080x2400 panel, stride 4320); backboardd connected
	status      touch       partial   driver hakios-touch (/dev/hakios-touch) connects to backboardd IOHIDEventSystem; Novatek NT36672C on GENI SE7 SPI
	status      buttons     missing
	status      cpu         works     SMP 4 cores; passed all 36 userland checks; launchd, backboardd, wifid, and SpringBoard running stable
	status      gpu         partial   Adreno 620: firmware a620_zap/a630_sqe/a650_gmu; UniXNU TZ zap authentication & hardware acceleration in progress
	status      storage     partial   loader surveys UFS (109 partitions, 6 units); kernel root on RAM disk; kernel panic log preserved in UFS logdump partition
	status      usb         works     loader fastboot (product xnuloader), oem paniclog (512 KB pram staging), CDC serial console
	status      network     works     dlil, lo0, and en0 (WCN3990 802.11) with live IPv4 data plane
	status      audio       works     TFA9874 amplifier on I2C @ 0x34 & SEC MI2S (GPIO 70-74); WCD938x codec over SoundWire master 2 & Bolero 1.2 TX macro (/dev/hakios-audio, /dev/hakios-mic)
	status      battery     missing
	status      camera      missing
	status      wifi        works     WCN3990 via MPSS PAS 4; OTA beacon scanning, 4-way WPA2 association, TX/RX Data Plane, BPF DHCP client leases IP on en0
	status      cellular    partial   PAS mpss=0x4 booted in lineage; not integrated in HakiOS yet
	status      thermal     missing
